<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dethember - Official Website</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: #121217;
      --border-color: #791b1b;
      --text-color: #c0c0c0;
      --accent-red: #9e2a2a;
      --accent-hover: #b83b3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }

    h1 {
      color: var(--accent-red);
      font-size: 2.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 1rem;
      color: #888;
      letter-spacing: 2px;
    }

    .section-title {
      color: var(--accent-red);
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin: 30px 0 20px 0;
      text-transform: uppercase;
      border-left: 4px solid var(--accent-red);
      padding-left: 10px;
      width: 100%;
      max-width: 900px;
    }

    /* Latest Single Card (Larger Hero Feature) */
    .latest-release {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 25px;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 30px rgba(121, 27, 27, 0.3);
      margin-bottom: 40px;
      text-align: center;
    }

    .latest-release img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border: 2px solid var(--border-color);
      margin-bottom: 20px;
    }

    .latest-release h3 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .latest-release .date-badge {
      color: var(--accent-red);
      font-size: 0.9rem;
      margin-bottom: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Discography Grid */
    .discography-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 50px;
    }

    .release-card {
      background: var(--card-bg);
      border: 1px solid #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: border-color 0.3s;
    }

    .release-card:hover {
      border-color: var(--border-color);
    }

    .release-card img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border: 1px solid #444;
      margin-bottom: 15px;
    }

    .release-card h4 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 10px;
    }

    /* Action Buttons */
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background-color: var(--accent-red);
      color: #fff;
      padding: 8px 16px;
      text-decoration: none;
      font-size: 0.85rem;
      font-family: inherit;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #222;
      border: 1px solid #444;
    }

    .btn-secondary:hover {
      background-color: #333;
    }

    footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.8rem;
      color: #555;
      padding-top: 20px;
      border-top: 1px solid #1a1a1a;
      width: 100%;
      max-width: 900px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dethember</h1>
    <p class="subtitle">Atmospheric & Experimental Black Metal • Persian Lyrics</p>
  </header>

  <!-- LATEST SINGLE SECTION -->
  <div class="section-title">Latest Single</div>
  <div class="latest-release">
    <img src="https://img.youtube.com/vi/OAgH3AMZfJ0/hqdefault.jpg" alt="Sorushi Bar Agahi Cover Art">
    <h3>Sorushi Bar Agahi</h3>
    <div class="date-badge">Released: October 14, 2026</div>
    <div class="btn-container">
      <a href="https://youtu.be/OAgH3AMZfJ0?si=15vkT-5d3gvtP7TN" target="_blank" class="btn">Watch on YouTube</a>
      <a href="https://ffm.to/sorushi-bar-agahi" target="_blank" class="btn btn-secondary">Stream / Platforms</a>
    </div>
  </div>

  <!-- DISCOGRAPHY SECTION -->
  <div class="section-title">Discography</div>
  <div class="discography-grid">

    <!-- Parishan Del -->
    <div class="release-card">
      <img src="parishan-del.jpg" alt="Parishan Del Cover Art">
      <h4>Parishan Del</h4>
      <div class="btn-container">
        <a href="#" target="_blank" class="btn btn-secondary">Listen</a>
      </div>
    </div>

    <!-- Future releases can be added here following the same structure -->

  </div>

  <footer>
    &copy; 2026 Dethember. All rights reserved. 100% Human-Made Artwork & Music.
  </footer>

</body>
</html>
