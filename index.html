<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DETHEMBER | Atmospheric Black Metal</title>
  
  <!-- Old English Web Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(17, 17, 22, 0.85);
      --accent-crimson: #791b1b;
      --accent-bright: #aa1e1e;
      --text-silver: #c0c0c0;
      --text-muted: #777777;
      --border-silver: #333333;
      --font-old-english: 'UnifrakturMaguntia', 'Old English Text MT', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: linear-gradient(rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.88)), url('face logo.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text-silver);
      font-family: var(--font-old-english);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 40px 20px 30px;
      border-bottom: 1px solid var(--accent-crimson);
    }

    .header-logo {
      max-width: 320px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(121, 27, 27, 0.6));
      margin-bottom: 15px;
    }

    .tagline {
      font-family: var(--font-old-english);
      color: var(--text-silver);
      letter-spacing: 0.05em;
      font-size: 1.4rem;
    }

    section {
      margin: 40px 0;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-silver);
      border-radius: 2px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
    }

    h2 {
      font-family: var(--font-old-english);
      font-size: 2.2rem;
      letter-spacing: 0.05em;
      color: var(--accent-crimson);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-silver);
      padding-bottom: 10px;
      text-align: center;
    }

    p {
      margin-bottom: 15px;
      color: var(--text-silver);
      font-size: 1.2rem;
      text-align: center;
    }

    .artwork-container {
      text-align: center;
      margin: 20px 0;
    }

    .artwork-img {
      max-width: 280px;
      width: 100%;
      border: 1px solid var(--accent-crimson);
      box-shadow: 0 0 15px rgba(121, 27, 27, 0.4);
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 14px 20px;
      background: #09090d;
      color: var(--text-silver);
      text-decoration: none;
      font-family: var(--font-old-english);
      font-size: 1.3rem;
      border: 1px solid var(--border-silver);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--accent-crimson);
      border-color: var(--accent-bright);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(121, 27, 27, 0.6);
    }

    footer {
      text-align: center;
      padding: 40px 0 20px;
      color: var(--text-muted);
      font-size: 1rem;
      border-top: 1px solid var(--border-silver);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <!-- Main Crest Logo -->
      <img src="00000logo LLLL.jpg" alt="DETHEMBER Logo" class="header-logo">
      <p class="tagline">One-man band from Iran. Atmospheric Black Metal / Persian Black Metal</p>
    </header>

    <!-- Circle Artwork Section -->
    <section id="visuals">
      <div class="artwork-container">
        <img src="face logo.png" alt="DETHEMBER Emblem" class="artwork-img">
      </div>
    </section>

    <!-- Music & Streaming Section -->
    <section id="streaming">
      <h2>Listen & Streaming</h2>
      <p>Stream official releases across all major platforms:</p>

      <div class="links-grid">
        <a href="https://open.spotify.com/artist/2boyGBpB3AMOLWnbMbCWeK?si=8LqT9CScRNaODARkZiceGA" class="btn" target="_blank">Spotify</a>
        <a href="https://music.apple.com/ie/artist/dethember/1832686371" class="btn" target="_blank">Apple Music</a>
        <a href="https://dethember.bandcamp.com/music" class="btn" target="_blank">Bandcamp</a>
        <a href="https://www.youtube.com/channel/UCt35F5iFd4QVcahnmcgFNGw" class="btn" target="_blank">YouTube</a>
      </div>
    </section>

    <!-- Social Media Links -->
    <section id="socials">
      <h2>Follow & Connect</h2>
      <p>Join the official channels:</p>

      <div class="links-grid">
        <a href="https://www.instagram.com/dethember/" class="btn" target="_blank">Instagram</a>
        <a href="https://www.tiktok.com/@dethemberband" class="btn" target="_blank">TikTok</a>
        <a href="https://x.com/dethember" class="btn" target="_blank">X (Twitter)</a>
      </div>
    </section>

    <footer>
      <p>&copy; DETHEMBER. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
