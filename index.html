<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DETHEMBER | Atmospheric Black Metal</title>
  
  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Explora&family=UnifrakturMaguntia&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(17, 17, 22, 0.85);
      --accent-crimson: #791b1b;
      --accent-bright: #aa1e1e;
      --text-silver: #c0c0c0;
      --text-muted: #777777;
      --border-silver: #333333;
      --font-old-english: 'UnifrakturMaguntia', 'Old English Text MT', serif;
      --font-ephesis: 'Ephesis', cursive;
      --font-explora: 'Explora', cursive;
      --font-pentagram: 'Pentagrams Callygraphy', 'UnifrakturMaguntia', serif;
    }

    /* Local custom font fallback declaration if Pentagrams Callygraphy is hosted locally */
    @font-face {
      font-family: 'Pentagrams Callygraphy';
      src: url('PentagramsCallygraphyRegular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: linear-gradient(rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.88)), url('face logo.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text-silver);
      font-family: var(--font-old-english);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 40px 20px 30px;
      border-bottom: 1px solid var(--accent-crimson);
    }

    .header-logo {
      max-width: 320px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(121, 27, 27, 0.6));
      margin-bottom: 15px;
    }

    .tagline-container {
      font-family: var(--font-pentagram);
      color: var(--text-silver);
      letter-spacing: 0.05em;
      font-size: 1.8rem;
      line-height: 1.4;
    }

    .tagline-container span {
      display: block;
    }

    section {
      margin: 40px 0;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-silver);
      border-radius: 2px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
    }

    .headline-old-english {
      font-family: var(--font-old-english);
      font-size: 2.2rem;
      letter-spacing: 0.05em;
      color: var(--accent-crimson);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-silver);
      padding-bottom: 10px;
      text-align: center;
    }

    p {
      margin-bottom: 15px;
      color: var(--text-silver);
      font-size: 1.2rem;
      text-align: center;
    }

    /* Image Gallery Grid */
    .image-trio {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .image-trio img {
      max-width: 240px;
      width: 100%;
      height: auto;
      border: 1px solid var(--accent-crimson);
      box-shadow: 0 0 15px rgba(121, 27, 27, 0.4);
      object-fit: cover;
    }

    .image-trio img.center-img {
      max-width: 260px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .links-grid {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      display: block;
      text-align: center;
      padding: 10px 15px;
      background: #09090d;
      color: var(--text-silver);
      text-decoration: none;
      border: 1px solid var(--border-silver);
      transition: all 0.3s ease;
    }

    .btn-ephesis {
      font-family: var(--font-ephesis);
      font-size: 2rem;
    }

    .btn:hover {
      background: var(--accent-crimson);
      border-color: var(--accent-bright);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(121, 27, 27, 0.6);
    }

    /* Contact Section Styling */
    .contact-container {
      text-align: center;
      font-family: var(--font-explora);
      font-size: 2.2rem;
    }

    .contact-container a {
      color: var(--text-silver);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-container a:hover {
      color: var(--accent-bright);
    }

    footer {
      text-align: center;
      padding: 40px 0 20px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-silver);
    }

    .footer-text {
      font-family: var(--font-explora);
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <!-- Main Crest Logo -->
      <img src="00000logo LLLL.jpg" alt="DETHEMBER Logo" class="header-logo">
      <div class="tagline-container">
        <span>One-man band from Iran</span>
        <span>Persian Black Metal</span>
      </div>
    </header>

    <!-- Visuals Section -->
    <section id="visuals">
      <div class="image-trio">
        <img src="00555.jpg" alt="Dethember Photo Left">
        <img src="face logo.png" alt="Dethember Face Logo Center" class="center-img">
        <img src="Dethember Black torn.jpg" alt="Dethember Photo Right">
      </div>
    </section>

    <!-- Music & Streaming Section -->
    <section id="streaming">
      <h2 class="headline-old-english">Ψ ♪𓃵 ψ Steaming Platforms Ψ ♪𓃵 ψ</h2>

      <div class="links-grid">
        <a href="https://open.spotify.com/artist/2boyGBpB3AMOLWnbMbCWeK?si=8LqT9CScRNaODARkZiceGA" class="btn btn-ephesis" target="_blank">Spotify</a>
        <a href="https://music.apple.com/ie/artist/dethember/1832686371" class="btn btn-ephesis" target="_blank">Apple Music</a>
        <a href="https://www.youtube.com/channel/UCt35F5iFd4QVcahnmcgFNGw" class="btn btn-ephesis" target="_blank">YouTube</a>
        <a href="https://music.youtube.com/channel/UCt35F5iFd4QVcahnmcgFNGw?si=4f2BvsUSdY5IgKw-" class="btn btn-ephesis" target="_blank">YouTube Music</a>
        <a href="https://tidal.com/artist/65228639" class="btn btn-ephesis" target="_blank">Tidal</a>
        <a href="https://dethember.bandcamp.com/music" class="btn btn-ephesis" target="_blank">Bandcamp</a>
      </div>
    </section>

    <!-- Social Media Links -->
    <section id="socials">
      <h2 class="headline-old-english">Social Medias</h2>

      <div class="links-grid">
        <a href="https://www.instagram.com/dethember/" class="btn btn-ephesis" target="_blank">Instagram</a>
        <a href="https://www.tiktok.com/@dethemberband" class="btn btn-ephesis" target="_blank">TikTok</a>
        <a href="https://x.com/dethember" class="btn btn-ephesis" target="_blank">X (Twitter)</a>
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
      <h2 class="headline-old-english">Contact</h2>
      <div class="contact-container">
        <p>Contact : <a href="mailto:dethember@gmail.com">dethember@gmail.com</a></p>
      </div>
    </section>

    <footer>
      <p class="footer-text">&copy; DETHEMBER. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
